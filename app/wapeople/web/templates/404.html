{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<div class="card empty">
  <h1>We couldn't find that page</h1>
  <p>The bill, legislator, vote or case may not exist, or the link may be mistyped. Bill links look like <code>/bills/2025-26/HB-1217</code>.</p>
  <form class="big-search" action="/search" role="search" style="margin:1rem auto 0">
    <label class="sr-only" for="nq">Search</label>
    <input id="nq" type="search" name="q" placeholder="Search bills, legislators, court cases">
    <button class="btn" type="submit">Search</button>
  </form>
</div>
{% endblock %}
